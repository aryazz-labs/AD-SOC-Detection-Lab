name: AD - Multiple Failed Kerberos Authentication Attempts
status: validated (DC01)
mitre:
  primary: T1110.001   # Brute Force: Password Guessing
data_source:
  index: windows_security
  sourcetypes:
    - XmlWinEventLog:Security   # DC01 (Kerberos pre-auth is evaluated on the DC)
  event: Security 4771 (Kerberos pre-authentication failed)
  requires_audit: Account Logon > Kerberos Authentication Service (Failure)
logic: >
  Counts 4771 failures with failure code 0x18 (bad password) per target user and source IP
  on the domain controller. A single user crossing 5 bad-password attempts inside the window
  indicates password guessing. 0x18 is specifically "pre-authentication information was
  invalid (wrong password)" — a locked account logs 0x12 instead and is deliberately excluded
  so lockouts do not inflate the brute-force count.
severity: Medium (escalates to High at >= 10 failures, via in-search eval)
schedule:
  cron: "*/5 * * * *"
  earliest: -15m
  latest: now
trigger: number of results > 0, per result
throttle:
  suppress: false            # KNOWN GAP — see findings/05-ad-alerts-no-throttling.md
why_window_longer_than_schedule: >
  Threshold detections keep a 15-minute window on a 5-minute schedule on purpose, so a slow
  brute force spread over several minutes still accumulates enough attempts to cross the
  threshold. The trade-off is duplicate fires until throttling is added (finding 5).
known_false_positives:
  - A user who changed their password and left a stale credential on a mapped drive, phone, or service.
  - Service account with an expired password still being retried by an application.
validated_with:
  - method: manual simulation
    detail: 5 bad passwords for soc.testuser via net use \\%logonserver%\IPC$ (Kerberos -> 4771 0x18 on DC01)
    alert_fired: "2026-11-17 00:35:02 IST"
  - atomic: T1110.001-1 "Brute Force Credentials of single AD user"
    input_args: 'user=soc.testuser'   # default targets %username% (the logged-in Administrator) — MUST override
    note: unlock soc.testuser first, or attempts return 0x12 (locked) instead of 0x18
    event_4771: "~2026-11-17 01:17 IST (5x 0x18, DC01)"
    alert_fired: "2026-11-17 01:20:01 IST"
